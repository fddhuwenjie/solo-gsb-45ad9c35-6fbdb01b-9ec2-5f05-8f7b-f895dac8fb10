services:
  draw:
    build: .
    image: public-draw:latest
    container_name: public-draw
    ports:
      - "8080:8080"
    volumes:
      - draw-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  draw-data:
